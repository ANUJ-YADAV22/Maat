[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maat"
version = "0.1.0"
description = "Maat: safe, warranted, reversible feedback-driven improvement of agentic AI without retraining"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33"]
ingest = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "pypdf>=4.0", "reportlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
